# DESHABILITADO 2026-10-02 por auditoria de CI.
#
# Motivo: este workflow pide tres secrets (VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID) que nunca se configuraron, asi que fallaba en CADA
# push con: Error: Input required and not supplied: vercel-token
#
# Ademas es redundante: el proyecto Vercel 'ni-hao-lab' ya esta conectado
# al repo y despliega solo en cada push a main (verificado en produccion:
# https://ni-hao-lab.vercel.app responde 200).
#
# Si alguna vez quieres desplegar desde Actions en vez de desde Vercel,
# configura los 3 secrets y quita este encabezado.
# ---------------------------------------------------------------------
# Auto-deploy a Vercel en cada push a main.
# Requiere 3 secrets en GitHub (repo → Settings → Secrets → Actions):
#   VERCEL_TOKEN      → vercel.com/account/tokens (Create)
#   VERCEL_ORG_ID     → vercel.com → Settings → General → Team ID
#   VERCEL_PROJECT_ID → proyecto en Vercel → Settings → General → Project ID
# Alternativa sin secrets: en vercel.com importa el repo (Add New → Import
# Git Repository) y cada push despliega solo.
name: Deploy a Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
